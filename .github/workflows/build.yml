name: Build APK & AAB

on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure SDK packages (platform 35 + build-tools)
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;34.0.0" || true

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Fetch Tajawal font (OFL)
        run: bash scripts/fetch_tajawal.sh

      - name: Generate signing keystore (CI only)
        run: |
          keytool -genkeypair -v -keystore release.keystore -alias sa \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android123 -keypass android123 -dname "CN=SmartAssistant"

      - name: Build signed APK + AAB
        env:
          KS_PATH: ${{ github.workspace }}/release.keystore
          KS_PASS: android123
          KS_ALIAS: sa
        run: |
          gradle wrapper --gradle-version 8.7 --no-daemon
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
