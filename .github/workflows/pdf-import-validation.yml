name: PDF Import Validation

on:
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Ensure SDK packages
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;34.0.0" || true

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Fetch Tajawal font
        run: bash scripts/fetch_tajawal.sh

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v -keystore release.keystore -alias sa \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android123 -keypass android123 -dname "CN=SmartAssistant"

      - name: Build signed APK + AAB
        env:
          KS_PATH: ../release.keystore
          KS_PASS: android123
          KS_ALIAS: sa
        run: |
          gradle wrapper --gradle-version 8.7 --no-daemon
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Upload validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf-import-validation-binaries
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
